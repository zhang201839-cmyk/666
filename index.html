<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>尊享电子菜谱</title>
    <style>
        :root {
            --bg-color: #12100e;
            --card-bg: #1c1815;
            --accent-gold: #d97706;
            --accent-orange: #ea580c;
            --text-primary: #f5f5f4;
            --text-secondary: #a8a29e;
            --border-color: rgba(217, 119, 6, 0.2);
            --price-color: #f97316;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        /* 全局防撑爆设置 */
        img {
            max-width: 100% !important;
            height: auto;
            display: block;
        }

        header {
            background: rgba(28, 24, 21, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .restaurant-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 4px;
        }

        .restaurant-slogan {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .dish-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 强行裁剪固定图片容器大小 */
        .dish-img-box {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #26211d;
            overflow: hidden;
        }

        .dish-img-box img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        .dish-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #dc2626;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 8px;
            z-index: 2;
        }

        .dish-info {
            padding: 14px;
        }

        .dish-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .dish-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .dish-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--price-color);
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .modal-content img {
            width: 100% !important;
            max-height: 300px !important;
            object-fit: cover !important;
        }

        .modal-body {
            padding: 16px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
            background: rgba(0,0,0,0.6);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="restaurant-name">美馔佳肴 · 私房菜菜单</div>
        <div class="restaurant-slogan">匠心烹饪，美味尽在舌尖</div>
    </header>

    <div class="container">
        <div class="menu-grid">
            <!-- 菜品 A -->
            <div class="dish-card" onclick="openModal('A.png', '清爽饮品 A', '¥18', '解腻清爽，口感细腻。')">
                <div class="dish-img-box">
                    <span class="dish-badge">招牌饮品</span>
                    < img src="A.png" alt="菜品 A">
                </div>
                <div class="dish-info">
                    <div class="dish-name">清爽饮品 A</div>
                    <div class="dish-desc">解腻清爽，口感细腻。</div>
                    <div class="dish-price">¥18</div>
                </div>
            </div>

            <!-- 菜品 B -->
            <div class="dish-card" onclick="openModal('B.png', '特色菜品 B', '¥88', '传统工序慢火炖煮，汤汁浓郁。')">
                <div class="dish-img-box">
                    <span class="dish-badge">主厨推荐</span>
                    < img src="B.png" alt="菜品 B">
                </div>
                <div class="dish-info">
                    <div class="dish-name">特色菜品 B</div>
                    <div class="dish-desc">传统工序慢火炖煮，汤汁浓郁。</div>
                    <div class="dish-price">¥88</div>
                </div>
            </div>

            <!-- 菜品 C -->
            <div class="dish-card" onclick="openModal('C.png', '典藏美味 C', '¥68', '用料考究，层次丰富。')">
                <div class="dish-img-box">
                    <span class="dish-badge">人气热销</span>
                    < img src="C.png" alt="菜品 C">
                </div>
                <div class="dish-info">
                    <div class="dish-name">典藏美味 C</div>
                    <div class="dish-desc">用料考究，层次丰富。</div>
                    <div class="dish-price">¥68</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="modal" id="dishModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            < img id="modalImg" src="" alt="菜品大图">
            <div class="modal-body">
                <h3 id="modalTitle" class="dish-name" style="font-size: 1.2rem;"></h3>
                <div id="modalPrice" class="dish-price" style="margin: 6px 0;"></div>
                <p id="modalDesc" class="dish-desc" style="margin-bottom: 0;"></p >
            </div>
        </div>
    </div>

    <script>
        function openModal(imgSrc, title, price, desc) {
            document.getElementById('modalImg').src = imgSrc;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalPrice').innerText = price;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('dishModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('dishModal').classList.remove('active');
        }
    </script>
</body>
</html>
