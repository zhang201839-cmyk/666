<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f5f5f5;
            padding: 40px 20px;
            font-family: system-ui, sans-serif;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 35px;
            color: #222;
        }
        .grid-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 28px;
        }
        .item {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .item img {
            width: 100%;
            height: 480px;
            object-fit: contain;
            display: block;
        }
        .item .label {
            padding: 16px;
            text-align: center;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>图集 A B C</h1>
        <div class="grid-box">
            <div class="item">
                < img src="A.png" alt="A">
                <div class="label">A</div>
            </div>
            <div class="item">
                < img src="B.png" alt="B">
                <div class="label">B</div>
            </div>
            <div class="item">
                < img src="C.png" alt="C">
                <div class="label">C</div>
            </div>
        </div>
    </div>
</body>
</html>
