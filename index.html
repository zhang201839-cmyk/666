<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>饭店精选菜单</title>
    <style>
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .menu-title {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .menu-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            overflow: hidden;
            width: 280px;
            text-align: center;
            padding-bottom: 15px;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .card h3 {
            margin: 15px 0 5px 0;
            color: #2c3e50;
        }
        .price {
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <h1 class="menu-title">美味饭店 - 精选菜品</h1>

    <div class="menu-grid">
        <div class="card">
            < img src="./dish1.png" alt="招牌菜一">
            <h3>招牌菜一</h3>
            <p class="price">￥48</p >
        </div>

        <div class="card">
            < img src="./dish2.png" alt="招牌菜二">
            <h3>招牌菜二</h3>
            <p class="price">￥68</p >
        </div>

        <div class="card">
            < img src="./dish3.png" alt="招牌菜三">
            <h3>招牌菜三</h3>
            <p class="price">￥32</p >
        </div>
    </div>

</body>
</html>
