<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片展示</title>
  <style>
    body {
      background-color: #f7f7f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px;
      margin: 0;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #000;
    }
    .card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    .card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
    }
    .card p {
      margin: 12px 0 0 0;
      font-size: 16px;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>图片展示</h1>

    <div class="card">
      < img src="postera.jpg" alt="postera">
      <p>postera</p >
    </div>

    <div class="card">
      < img src="posterb.jpg" alt="posterb">
      <p>posterb</p >
    </div>

    <div class="card">
      < img src="posterm.jpg" alt="posterm">
      <p>posterm</p >
    </div>
  </div>

</body>
</html>
