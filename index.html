<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜品展示</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f7;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 2.2rem;
            color: #1d1d1f;
        }
        .gallery {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            max-width: 1100px;
            width: 100%;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            width: 300px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .card-info {
            padding: 16px;
        }
        .card-info p {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333333;
        }
    </style>
</head>
<body>

    <h1>菜品展示</h1>

    <div class="gallery">
        <div class="card">
            < img src="dish1.png" alt="Dish 1">
            <div class="card-info">
                <p>Dish 1</p >
            </div>
        </div>

        <div class="card">
            < img src="dish2.png" alt="Dish 2">
            <div class="card-info">
                <p>Dish 2</p >
            </div>
        </div>

        <div class="card">
            < img src="dish3.png" alt="Dish 3">
            <div class="card-info">
                <p>Dish 3</p >
            </div>
        </div>
    </div>

</body>
</html>
