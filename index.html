<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'ÉTOILE - Michelin Tasting Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            color: #d4af37;
            font-family: 'Georgia', 'Times New Roman', 'Songti SC', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .menu-card {
            background: linear-gradient(145deg, #141414, #0a0a0a);
            border: 1px solid #c5a059;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(197, 160, 89, 0.15);
            max-width: 480px;
            width: 100%;
            padding: 48px 36px;
            text-align: center;
            position: relative;
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 1px solid rgba(197, 160, 89, 0.3);
            pointer-events: none;
        }

        .header h1 {
            font-size: 2rem;
            letter-spacing: 7px;
            text-transform: uppercase;
            color: #f3e5ab;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .header p {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #8c8c8c;
            text-transform: uppercase;
        }

        .star-icon {
            color: #c5a059;
            margin: 18px 0;
            font-size: 0.9rem;
            letter-spacing: 5px;
        }

        .hero-container {
            margin: 24px 0;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(197, 160, 89, 0.4);
            border-radius: 2px;
            background-color: #000;
        }

        /* 关键图片样式 */
        .hero-img {
            width: 100%;
            height: auto;
            max-height: 280px;
            object-fit: cover;
            display: block;
            margin: 0 auto;
            transition: transform 0.6s ease;
        }

        .hero-container:hover .hero-img {
            transform: scale(1.04);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #c5a059, transparent);
            margin: 28px auto;
            width: 80%;
        }

        .menu-item {
            margin-bottom: 22px;
        }

        .item-title {
            font-size: 1rem;
            color: #e5c158;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .item-desc {
            font-size: 0.82rem;
            color: #aaa;
            margin-top: 5px;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        .footer {
            margin-top: 32px;
        }

        .price {
            font-size: 1.25rem;
            letter-spacing: 3px;
            color: #f3e5ab;
        }

        .note {
            font-size: 0.7rem;
            color: #666;
            margin-top: 8px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="menu-card">
        <div class="header">
            <h1>L'ÉTOILE</h1>
            <p>Michelin Three Stars Tasting Menu</p >
        </div>

        <div class="star-icon">★ ★ ★</div>

        <!-- 修正后的图片标签 -->
        <div class="hero-container">
            < img class="hero-img" src="fggfg.png" alt="Michelin Signature Dish">
        </div>

        <div class="divider"></div>

        <div class="menu-item">
            <div class="item-title">Amuse-Bouche</div>
            <div class="item-desc">黑松露和牛塔塔 · 鱼子酱 · 金箔</div>
        </div>

        <div class="menu-item">
            <div class="item-title">Le Plat Principal</div>
            <div class="item-desc">熟成 M9+ 肋眼牛肉 · 炙烤香蕈 · 浓缩牛骨酱汁</div>
        </div>

        <div class="menu-item">
            <div class="item-title">Le Dessert</div>
            <div class="item-desc">马达加斯加香草法式焦糖布蕾 · 冰霜欧芹</div>
        </div>

        <div class="divider"></div>

        <div class="footer">
            <div class="price">CNY 2,880 / Person</div>
            <div class="note">包含搭配葡萄酒 | 另加 10% 服务费</div>
        </div>
    </div>

</body>
</html>
