<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Étoile D'Or | 米其林三星顶奢餐厅</title>
    <!-- Google Fonts 引入高级衬线与现代无衬线字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@200;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #141414;
            --accent-gold: #c5a059;
            --accent-gold-light: #e6ca65;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --border-color: rgba(197, 160, 89, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 导航栏 */
        header {
            padding: 2.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(13, 13, 13, 0.85);
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 2.5rem;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-gold);
        }

        /* 主体英雄区 */
        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 5%;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5rem;
            align-items: center;
        }

        /* 左侧：菜品渲染图 */
        .image-wrapper {
            position: relative;
            padding: 15px;
            border: 1px solid var(--border-color);
            background: linear-gradient(145deg, rgba(20,20,20,1) 0%, rgba(13,13,13,1) 100%);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        .image-wrapper::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 1px solid var(--accent-gold);
            opacity: 0.3;
            pointer-events: none;
        }

        .dish-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            filter: contrast(1.05) brightness(0.95);
            transition: transform 0.7s ease;
        }

        .image-wrapper:hover .dish-img {
            transform: scale(1.02);
        }

        /* 右侧：文案说明 */
        .dish-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .michelin-stars {
            color: var(--accent-gold);
            font-size: 1.2rem;
            letter-spacing: 0.3em;
            margin-bottom: 1rem;
        }

        .category {
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
        }

        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 300;
            margin-bottom: 2rem;
            text-align: justify;
        }

        .flavor-notes {
            border-left: 2px solid var(--accent-gold);
            padding-left: 1.5rem;
            margin-bottom: 2.5rem;
            font-style: italic;
            color: #d1d1d1;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
        }

        .price-section {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: var(--accent-gold);
        }

        .btn-reserve {
            background: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 1rem 2.5rem;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .btn-reserve:hover {
            background-color: var(--accent-gold);
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 3rem 0;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
        }

        /* 响应式适配 */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                gap: 3rem;
            }
            .title {
                font-size: 2.2rem;
            }
            header {
                flex-direction: column;
                gap: 1rem;
            }
            nav a {
                margin: 0 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- 顶栏 -->
    <header>
        <div class="logo">L'Étoile D'Or</div>
        <nav>
            <a href="#">MENU</a>
            <a href="#">PHILOSOPHY</a>
            <a href="#">CHEF'S TABLE</a>
            <a href="#">RESERVATIONS</a>
        </nav>
    </header>

    <!-- 核心展示区 -->
    <section class="hero">
        <div class="container">
            <!-- 渲染图片区域 -->
            <div class="image-wrapper">
                <img src="fggfg.png" alt="Michelin Signature Dish" class="dish-img">
            </div>

            <!-- 菜品文字区域 -->
            <div class="dish-details">
                <div class="michelin-stars">★ ★ ★</div>
                <div class="category">AUTUMN MENU · SIGNATURE DISH</div>
                <h1 class="title">秘制金丝麦香乾麵<br><i>配烘焙白芝麻与金黄蛋花</i></h1>
                
                <p class="description">
                    采用东方高山特选小麦，历经多次锤炼与日光风干形成极具弹性的曲折金丝。搭配主厨特调红油微辣浓汁，融合低温滑熟的高山有机蛋花，最后撒上微火慢烘的极品白芝麻。醇香浓郁，层次丰富。
                </p>

                <div class="flavor-notes">
                    “麦香的刚劲与芝麻的柔香在舌尖交织，带来极致抚慰心灵的奢华享受。”
                </div>

                <div class="price-section">
                    <div class="price">¥ 888</div>
                    <button class="btn-reserve">预订主厨餐桌</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <p>© 2026 L'ÉTOILE D'OR RESTAURANT. ALL RIGHTS RESERVED.</p>
    </footer>

</body>
</html>
