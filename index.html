<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜品展示</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 15px;
            width: 300px;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        .card p {
            margin-top: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #444;
        }
    </style>
</head>
<body>

    <h1>菜品展示</h1>

    <div class="container">
        <div class="card">
            < img src="./dish1.png" alt="Dish 1">
            <p>Dish 1</p >
        </div>

        <div class="card">
            < img src="./dish2.png" alt="Dish 2">
            <p>Dish 2</p >
        </div>

        <div class="card">
            < img src="./dish3.png" alt="Dish 3">
            <p>Dish 3</p >
        </div>
    </div>

</body>
</html>
